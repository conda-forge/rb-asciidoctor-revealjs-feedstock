# Recipe for asciidoctor-revealjs Ruby gem
# A reveal.js converter for Asciidoctor and Asciidoctor.js that transforms an AsciiDoc document into an HTML5 presentation
schema_version: 1

context:
  version: "6.0.0"

package:
  name: rb-asciidoctor-revealjs
  version: ${{ version }}

source:
  url: https://rubygems.org/downloads/asciidoctor-revealjs-${{ version }}.gem
  sha256: e9f34ff721debda1bff7602fc5f267fae83b913e20476b50403a289f41fcf8fc

build:
  noarch: generic
  number: 0
  script:
    - gem install -N -l -V --norc --ignore-dependencies asciidoctor-revealjs-${{ version }}.gem
    - gem unpack asciidoctor-revealjs-${{ version }}.gem
    - cp asciidoctor-revealjs-${{ version }}/LICENSE.adoc .

requirements:
  host:
    - ruby ${{ ruby_min }}.*
  run:
    - ruby >=${{ ruby_min }}
    - asciidoctor >=2.0.0,<3.0.0

tests:
  - package_contents:
      files:
        - share/rubygems/gems/asciidoctor-revealjs-${{ version }}/lib/asciidoctor_revealjs.rb
        - share/rubygems/bin/asciidoctor-revealjs
  - script:
      - ruby -r asciidoctor_revealjs -e 'exit 0'
      - asciidoctor-revealjs --version
      - >-
        ruby -r asciidoctor_revealjs -e '
        html = Asciidoctor.convert("= Smoke test\n\n== Slide\n\nHello", backend: "revealjs", header_footer: true);
        abort "reveal.js conversion failed" unless html.include?(%(<div class="reveal">)) && html.include?("<p>Hello</p>")'

about:
  homepage: https://github.com/asciidoctor/asciidoctor-reveal.js
  summary: A reveal.js converter for Asciidoctor. Write your slides in AsciiDoc!
  description: |
    Asciidoctor reveal.js is a converter for Asciidoctor and Asciidoctor.js that
    transforms an AsciiDoc document into an HTML5 presentation designed to be
    executed by the reveal.js presentation framework.
  license: MIT
  license_file: LICENSE.adoc
  documentation: https://docs.asciidoctor.org/reveal.js-converter/latest/
  repository: https://github.com/asciidoctor/asciidoctor-reveal.js

extra:
  recipe-maintainers:
    - phreed
    - jdmarques
